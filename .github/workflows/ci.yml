name: CI

on:
   pull_request:
   push:
      branches: [main]

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

jobs:
   verify:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: npm
         - run: npm ci
         - run: npm run lint
         - run: npm run format:check
         - run: npm test
         - run: npm run build
         - uses: actions/upload-pages-artifact@v3
           if: github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
           with:
              path: dist

   deploy:
      if: github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
      needs: verify
      runs-on: ubuntu-latest
      permissions:
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@v4
