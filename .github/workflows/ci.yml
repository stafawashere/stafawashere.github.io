name: CI

on:
   pull_request:
   push:
      branches: [main]

concurrency:
   group: ci-${{ github.ref }}
   cancel-in-progress: true

jobs:
   verify:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: npm
         - run: npm ci
         - run: npm run lint
         - run: npm run format:check
         - run: npm test
         - run: npm run build
         - name: Publish dist to gh-pages
           if: github.event_name == 'push' && vars.DEPLOY_PAGES == 'true'
           run: |
              cd dist
              touch .nojekyll
              echo "mahfujmustafa.dev" > CNAME
              git init -q -b gh-pages
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              git commit -q -m "Deploy ${GITHUB_SHA}"
              git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
